name: Verify deployed Worker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-worker.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://honse-rpg-action.hancg0116.workers.dev
    steps:
      - name: Verify public health
        run: curl --fail --silent --show-error "$WORKER_URL/health" > /dev/null

      - name: Verify authenticated D1 read
        env:
          ACTION_API_KEY: ${{ secrets.ACTION_API_KEY }}
        run: |
          test -n "$ACTION_API_KEY"
          test "${#ACTION_API_KEY}" -ge 64
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTION_API_KEY" \
            "$WORKER_URL/v1/save-slots" > /dev/null
